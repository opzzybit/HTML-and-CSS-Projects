<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result-Summary-Component</title>
  <link href="style.css" rel="stylesheet"/>
</head>
<body class="boby">
  <div class="first-container"> 
    
    <div class="summary"><h2>Summary</h2></div>
    
    <div class="reaction">
      <img src="assets/images/icon-reaction.svg">
      <h4>Reaction</h4>
      <h5>80</h5>
      <h6>/ 100</h6>
    </div>

    <div class="memory">
      <img src="assets/images/icon-memory.svg">
      <h4>Memory</h4>
      <h5>92</h5>
      <h6>/ 100</h6>
    </div>
    
    <div class="verbal">
      <img src="assets/images/icon-verbal.svg">
      <h4>Verbal</h4>
      <h5>61</h5>
      <h6>/ 100</h6>
    </div>

    <div class="visual">
      <img src="assets/images/icon-visual.svg">
      <h4>Visual</h4>
      <h5>73</h5>
      <h6>/ 100</h6>
    </div>
    
    <a href="#" class="Continue-button"><h1>Continue</h1></a>
    
    <div class="second-container">
       <h5>Your Result</h5>
      <div class="circle">
        <h1 class="total">70</h1>
        <p class="score-total">of 100</p>
      </div>
      <h3 class="appluse">Great</h3>
        <p class="description">
          you scored higher than 65% of<br>
          the people who have taken<br>
          these tests.
        </p>
        <h5></h5>
    </div> 
  </div>

  <!--

  Memory

  Verbal

  Visual

  Continue-->
  
</body>
</html>
